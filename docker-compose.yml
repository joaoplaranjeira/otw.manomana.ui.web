services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-remote}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-remote}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "${DEV_WEB_PORT:-3001}:3000"

volumes:
  node_modules:
