services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-remote}
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080}
      NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-remote}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080}
      NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-remote}
      WATCHPACK_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "${DEV_WEB_PORT:-3001}:3000"

volumes:
  node_modules:
